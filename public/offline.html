<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nomarc — Signal Lost</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #ffd716;
      --ink: #1e1e1e;
      --bg: #0d0d0d;
      --grid: rgba(255,255,255,0.035);
    }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: #fff;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem 1.5rem;
      gap: 0;
    }

    /* blueprint grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
    }

    /* ── layout wrapper: everything inside, flex-shrink to fit ── */
    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 480px;
      max-height: 100%;
      gap: clamp(0.5rem, 1.5vh, 1.25rem);
      flex: 1;
    }

    /* radar canvas — scales with viewport height */
    #radar {
      position: relative;
      width: clamp(120px, 28vh, 280px);
      height: clamp(120px, 28vh, 280px);
      flex-shrink: 1;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* glitch heading */
    .heading {
      position: relative;
      z-index: 10;
      text-align: center;
      flex-shrink: 0;
    }
    .label {
      font-size: clamp(0.5rem, 1.2vh, 0.6875rem);
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--yellow);
      margin-bottom: clamp(0.25rem, 0.8vh, 0.5rem);
    }
    h1 {
      font-size: clamp(1.75rem, 5.5vh, 4rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #fff;
      position: relative;
    }
    /* glitch layers */
    h1::before, h1::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0; right: 0;
      overflow: hidden;
      clip-path: inset(0 0 50% 0);
    }
    h1::before {
      left: -2px;
      color: #ff2d6b;
      animation: glitch-1 3.5s infinite;
    }
    h1::after {
      left: 2px;
      color: #29e7ff;
      animation: glitch-2 3.5s infinite;
    }
    @keyframes glitch-1 {
      0%, 90%, 100% { clip-path: inset(100% 0 0 0); transform: none; opacity: 0; }
      91%            { clip-path: inset(10% 0 60% 0); transform: translateX(-4px); opacity: 1; }
      93%            { clip-path: inset(70% 0 5% 0);  transform: translateX(3px);  opacity: 1; }
      95%            { clip-path: inset(30% 0 40% 0); transform: translateX(-2px); opacity: 1; }
      97%            { clip-path: inset(100% 0 0 0);  transform: none; opacity: 0; }
    }
    @keyframes glitch-2 {
      0%, 88%, 100% { clip-path: inset(100% 0 0 0); transform: none; opacity: 0; }
      89%            { clip-path: inset(50% 0 20% 0); transform: translateX(4px);  opacity: 1; }
      91%            { clip-path: inset(5% 0 75% 0);  transform: translateX(-3px); opacity: 1; }
      94%            { clip-path: inset(100% 0 0 0);  transform: none; opacity: 0; }
    }

    .sub {
      color: rgba(255,255,255,0.45);
      font-size: clamp(0.75rem, 1.6vh, 0.9375rem);
      line-height: 1.5;
      text-align: center;
      max-width: 340px;
      flex-shrink: 0;
    }

    /* status dot */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: clamp(0.6rem, 1.2vh, 0.75rem);
      font-weight: 600;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ef4444;
      animation: blink 1.2s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    /* quick links */
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
      justify-content: center;
      flex-shrink: 0;
    }
    .links a {
      padding: clamp(0.3rem, 0.7vh, 0.5rem) clamp(0.65rem, 1.2vh, 1rem);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      font-size: clamp(0.65rem, 1.3vh, 0.8125rem);
      font-weight: 500;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s;
    }
    .links a:hover { border-color: var(--yellow); color: #fff; }

    /* retry button */
    .btn {
      display: block;
      padding: clamp(0.55rem, 1.2vh, 0.875rem) 2rem;
      background: var(--yellow);
      color: var(--ink);
      font-weight: 700;
      font-size: clamp(0.75rem, 1.5vh, 0.9375rem);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .btn:hover { background: #e6c114; }
    .btn:active { transform: scale(0.97); }

    /* brand watermark */
    .brand {
      font-size: clamp(0.55rem, 1vh, 0.75rem);
      color: rgba(255,255,255,0.15);
      white-space: nowrap;
      letter-spacing: 0.06em;
      flex-shrink: 0;
    }

    /* attempted URL display */
    .attempted {
      font-size: clamp(0.6rem, 1.1vh, 0.75rem);
      color: rgba(255,255,255,0.22);
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
      flex-shrink: 0;
    }
    .attempted code {
      background: rgba(255,255,255,0.06);
      padding: 0.15em 0.5em;
      border-radius: 4px;
      font-family: 'SF Mono', Menlo, monospace;
    }

    /* back-online overlay */
    #back-online {
      position: fixed; inset: 0; z-index: 100;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s;
    }
    #back-online.show { opacity: 1; pointer-events: all; }
    #back-online .ring {
      width: 80px; height: 80px; border-radius: 50%;
      border: 3px solid var(--yellow);
      display: flex; align-items: center; justify-content: center;
      animation: ring-in 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    @keyframes ring-in {
      from { transform: scale(0.4); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    #back-online p { font-size: 1.125rem; font-weight: 700; color: var(--yellow); }
    #back-online small { color: rgba(255,255,255,0.4); font-size: 0.8125rem; }
  </style>
</head>
<body>

  <!-- back-online celebration overlay -->
  <div id="back-online">
    <div class="ring">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ffd716" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <p>Signal restored!</p>
    <small id="redirect-label">Taking you back…</small>
  </div>

  <div class="page">
    <!-- radar -->
    <div id="radar">
      <canvas id="c"></canvas>
    </div>

    <!-- text -->
    <div class="heading">
      <p class="label">Signal Lost</p>
      <h1 data-text="Offline">Offline</h1>
    </div>

    <p class="sub">The connection to Nomarc's servers was lost.<br>Check your network and try again.</p>

    <div class="status-row">
      <span class="dot" id="dot"></span>
      <span id="status-text">No internet connection</span>
    </div>

    <!-- show the URL they were trying to reach -->
    <p class="attempted" id="attempted"></p>

    <nav class="links">
      <a href="/dashboard">Dashboard</a>
      <a href="/dashboard/messages">Messages</a>
      <a href="/dashboard/products">Products</a>
      <a href="/dashboard/jobs">Jobs</a>
    </nav>

    <button class="btn" id="retry-btn">Try again</button>

    <p class="brand">NOMARC PROJECTS</p>
  </div>

  <script>
    /* ── Show what URL the user was trying to reach ────────── */
    var targetPath = window.location.pathname;
    if (targetPath && targetPath !== '/' && targetPath !== '/offline.html' && targetPath !== '/offline') {
      document.getElementById('attempted').innerHTML = 'Trying to reach <code>' + targetPath + '</code>';
    }

    /* ── Radar canvas ─────────────────────────────────────── */
    var canvas = document.getElementById('c');
    var ctx    = canvas.getContext('2d');
    var W, H, cx, cy, R;

    function resize() {
      var rect = canvas.parentElement.getBoundingClientRect();
      W = canvas.width  = rect.width  * devicePixelRatio;
      H = canvas.height = rect.height * devicePixelRatio;
      cx = W / 2; cy = H / 2;
      R  = Math.min(W, H) * 0.44;
    }
    resize();
    window.addEventListener('resize', resize);

    var angle   = 0;
    var glitch  = 0;
    var glitchT = 0;
    var blips   = [];

    function randRange(a, b) { return a + Math.random() * (b - a); }

    function spawnBlip() {
      var a = angle - randRange(0.05, 0.5);
      var r = randRange(R * 0.2, R * 0.88);
      blips.push({ a: a, r: r, life: 1 });
    }

    var frame = 0;
    function draw() {
      requestAnimationFrame(draw);
      frame++;

      ctx.clearRect(0, 0, W, H);

      // glitch timer
      glitchT--;
      if (glitchT <= 0) {
        glitch = randRange(0.4, 1);
        glitchT = randRange(40, 180);
        setTimeout(function() { glitch = 0; }, randRange(80, 300));
      }

      // rotate sweep
      var speed = glitch > 0.5
        ? (Math.random() < 0.3 ? 0 : randRange(-0.04, 0.08))
        : 0.018;
      angle += speed;

      if (Math.random() < 0.06 && glitch < 0.3) spawnBlip();

      blips = blips.filter(function(b) { return b.life > 0; });
      blips.forEach(function(b) { b.life -= 0.008; });

      /* rings */
      [0.33, 0.6, 0.85, 1].forEach(function(frac, i) {
        var r = R * frac;
        var dashLen   = (2 * Math.PI * r) / 24;
        var dashBreak = dashLen * (glitch > 0.6 ? randRange(0.4, 1.2) : 0.25);
        ctx.save();
        ctx.strokeStyle = 'rgba(255,215,22,' + (0.12 + i * 0.04) + ')';
        ctx.lineWidth   = 1.2 * devicePixelRatio;
        ctx.setLineDash([dashLen, dashBreak]);
        ctx.lineDashOffset = glitch > 0.5 ? randRange(0, dashLen * 4) : frame * 0.3;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      });

      /* cross-hairs */
      ctx.save();
      ctx.strokeStyle = 'rgba(255,215,22,0.08)';
      ctx.lineWidth   = 1 * devicePixelRatio;
      ctx.setLineDash([6 * devicePixelRatio, 8 * devicePixelRatio]);
      ctx.beginPath(); ctx.moveTo(cx, cy - R * 1.05); ctx.lineTo(cx, cy + R * 1.05); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - R * 1.05, cy); ctx.lineTo(cx + R * 1.05, cy); ctx.stroke();
      ctx.restore();

      /* sweep trail */
      var trailLen = Math.PI * 0.55;
      for (var t = 0; t < 32; t++) {
        var frac  = t / 32;
        var a     = angle - trailLen * frac;
        var alpha = (1 - frac) * (glitch > 0.6 ? randRange(0, 0.28) : 0.18);
        ctx.save();
        ctx.strokeStyle = 'rgba(255,215,22,' + alpha + ')';
        ctx.lineWidth   = R * 0.96;
        ctx.beginPath();
        ctx.arc(cx, cy, R * 0.48, a - 0.025, a + 0.025);
        ctx.stroke();
        ctx.restore();
      }

      /* sweep arm */
      ctx.save();
      if (glitch > 0.6) {
        ctx.translate(randRange(-2, 2) * devicePixelRatio, randRange(-2, 2) * devicePixelRatio);
      }
      ctx.strokeStyle = 'rgba(255,215,22,' + (0.7 + glitch * 0.3) + ')';
      ctx.lineWidth   = 1.5 * devicePixelRatio;
      ctx.shadowBlur  = 10 * devicePixelRatio;
      ctx.shadowColor = '#ffd716';
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(angle) * R * 0.96, cy + Math.sin(angle) * R * 0.96);
      ctx.stroke();
      ctx.restore();

      /* centre dot */
      ctx.save();
      ctx.fillStyle   = '#ffd716';
      ctx.shadowBlur  = 14 * devicePixelRatio;
      ctx.shadowColor = '#ffd716';
      ctx.beginPath();
      ctx.arc(cx, cy, 3.5 * devicePixelRatio, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      /* blips */
      blips.forEach(function(b) {
        var bx = cx + Math.cos(b.a) * b.r;
        var by = cy + Math.sin(b.a) * b.r;
        ctx.save();
        ctx.fillStyle   = 'rgba(255,215,22,' + (b.life * 0.85) + ')';
        ctx.shadowBlur  = 12 * devicePixelRatio;
        ctx.shadowColor = '#ffd716';
        ctx.beginPath();
        ctx.arc(bx, by, Math.max(0, 3 * devicePixelRatio * b.life), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      /* outer ring border */
      ctx.save();
      ctx.strokeStyle = 'rgba(255,215,22,' + (0.22 + (glitch > 0.5 ? Math.random() * 0.2 : 0)) + ')';
      ctx.lineWidth   = 1.5 * devicePixelRatio;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      /* NO SIGNAL text */
      if (glitch < 0.4 || Math.random() < 0.5) {
        ctx.save();
        ctx.fillStyle    = 'rgba(255,255,255,0.12)';
        ctx.font         = '600 ' + (10 * devicePixelRatio) + 'px -apple-system,sans-serif';
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('NO SIGNAL', cx, cy + R * 0.18);
        ctx.restore();
      }
    }

    draw();

    /* ── Retry ────────────────────────────────────────────── */
    document.getElementById('retry-btn').addEventListener('click', function() {
      window.location.reload();
    });

    /* ── Back online → reload the same URL (which is the page they wanted) ── */
    window.addEventListener('online', function() {
      document.getElementById('dot').style.background = '#22c55e';
      document.getElementById('dot').style.animation  = 'none';
      document.getElementById('status-text').textContent = 'Back online!';
      document.getElementById('back-online').classList.add('show');
      document.getElementById('redirect-label').textContent =
        targetPath !== '/' && targetPath !== '/offline.html'
          ? 'Loading ' + targetPath + '…'
          : 'Taking you back…';
      glitch = 0;
      // Reload the current URL — the address bar still shows the original
      // URL the user tried to reach, so reload fetches that page for real
      setTimeout(function() { window.location.reload(); }, 1500);
    });
  </script>
</body>
</html>
